name: Android build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag, e.g. v1.0.0 (leave empty for a plain build)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Set by pushing a v* tag, or by running the workflow by hand with release_tag.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Render previews
        run: ./gradlew --no-daemon -p tools/preview run -Pscale=0.5

      - uses: actions/upload-artifact@v4
        with:
          name: hbsnoor-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hbsnoor-previews
          path: tools/preview/build/previews/*.png

      # Publishes the APK as a GitHub Release (creating the tag if needed).
      - name: Name release APK
        if: env.RELEASE_TAG != ''
        run: cp app/build/outputs/apk/release/app-release.apk "HBSnoor-${RELEASE_TAG}.apk"

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: HBSnoor ${{ env.RELEASE_TAG }}
          make_latest: true
          files: HBSnoor-${{ env.RELEASE_TAG }}.apk
          body: |
            **HBSnoor**: İslami duvar kağıtları, Hanife Betül için 🌙

            **Kurulum:** `HBSnoor-${{ env.RELEASE_TAG }}.apk` dosyasını tablete indirip açın. Sorulursa "bilinmeyen uygulamaları yükle" iznini verin.

            Samsung Galaxy Tab S9 FE için ayarlandı; Android 10 ve üzeri her telefon ve tablette çalışır.

  # Renders every wallpaper on a real Android emulator (the real text stack and fonts)
  # and uploads the PNGs, so Arabic layout can be checked before it reaches a device.
  device-previews:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Render on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # Install and run the test directly: connectedAndroidTest uninstalls the app
          # afterwards, which would delete the rendered PNGs before they can be pulled.
          script: |
            ./gradlew --no-daemon installDebug installDebugAndroidTest
            adb shell am instrument -w -e class com.noor.wallpapers.DevicePreviewTest com.noor.wallpapers.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q "OK (1 test)" instrument.txt
            adb pull /sdcard/Android/data/com.noor.wallpapers/files/device-previews device-previews

      - uses: actions/upload-artifact@v4
        with:
          name: hbsnoor-device-previews
          path: device-previews
